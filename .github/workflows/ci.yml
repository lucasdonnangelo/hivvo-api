name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest

    # Nenhum step escreve no repositório (só clona, instala e roda) — sem este
    # bloco o GITHUB_TOKEN herdaria o default do repo, que pode ser write.
    permissions:
      contents: read

    env:
      # Valores DUMMY. Nenhum secret do GitHub é referenciado aqui, e nenhum
      # destes valores alcança produção.
      #
      # DATABASE_URL e SECRET_KEY não têm default em app/core/config.py: sem
      # elas, `Settings()` levanta ValidationError no import e a suíte nem
      # coleta. Por isso precisam existir — mas só como placeholder.
      #
      # O arquivo SQLite abaixo é um destino inerte: os testes nunca o abrem
      # (a fixture `session` cria seu próprio engine :memory:, e os testes de
      # endpoint sobrescrevem get_session), e um dialeto de arquivo local não
      # tem como falar com o Supabase nem com qualquer rede.
      # NÃO troque por "sqlite://" (:memory:): app/core/database.py passa
      # max_overflow ao create_engine, que o SingletonThreadPool do :memory:
      # rejeita com TypeError no import.
      DATABASE_URL: sqlite:///./ci_dummy.db
      SECRET_KEY: ci-dummy-secret-key-not-a-real-credential-000000
      # Fora de "production" (que dispara o fail-fast de boot e a validação de
      # força da SECRET_KEY) e fora de "development" (que liga echo=True do
      # SQLAlchemy e o log DEBUG).
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # O repositório não declara versão de Python (não há runtime.txt,
          # .python-version, pyproject.toml nem Dockerfile). 3.13 é a versão em
          # que a suíte é executada no ambiente de desenvolvimento e a única em
          # que ela é comprovadamente verde. Ao fixar a versão de produção,
          # alinhe este valor com ela.
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        # requirements-dev.txt já faz "-r requirements.txt": um comando cobre
        # runtime e teste.
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest tests/ -q
