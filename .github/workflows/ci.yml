name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: pytest
    runs-on: ubuntu-latest

    # Nenhum step escreve no repositório (só clona, instala e roda) — sem este
    # bloco o GITHUB_TOKEN herdaria o default do repo, que pode ser write.
    permissions:
      contents: read

    env:
      # Valores DUMMY. Nenhum secret do GitHub é referenciado aqui, e nenhum
      # destes valores alcança produção.
      #
      # DATABASE_URL e SECRET_KEY não têm default em app/core/config.py: sem
      # elas, `Settings()` levanta ValidationError no import e a suíte nem
      # coleta. Por isso precisam existir — mas só como placeholder.
      #
      # O arquivo SQLite abaixo é um destino inerte: os testes nunca o abrem
      # (a fixture `session` cria seu próprio engine :memory:, e os testes de
      # endpoint sobrescrevem get_session), e um dialeto de arquivo local não
      # tem como falar com o Supabase nem com qualquer rede.
      # NÃO troque por "sqlite://" (:memory:): app/core/database.py passa
      # max_overflow ao create_engine, que o SingletonThreadPool do :memory:
      # rejeita com TypeError no import.
      DATABASE_URL: sqlite:///./ci_dummy.db
      SECRET_KEY: ci-dummy-secret-key-not-a-real-credential-000000
      # Fora de "production" (que dispara o fail-fast de boot e a validação de
      # força da SECRET_KEY) e fora de "development" (que liga echo=True do
      # SQLAlchemy e o log DEBUG).
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # O repositório não declara versão de Python (não há runtime.txt,
          # .python-version, pyproject.toml nem Dockerfile). 3.13 é a versão em
          # que a suíte é executada no ambiente de desenvolvimento e a única em
          # que ela é comprovadamente verde. Ao fixar a versão de produção,
          # alinhe este valor com ela.
          python-version: '3.13'
          cache: pip
          # Agora que requirements-dev.txt é um lock em ==, o hash deste arquivo
          # IDENTIFICA o conjunto instalado. Enquanto ele especificava >=, o
          # hash não mudava quando a resolução mudava, e o cache podia servir um
          # conjunto enquanto a resolução pedia outro.
          cache-dependency-path: requirements-dev.txt

      - name: Conferir o lock (desvio entre os .in e os .txt)
        # ANTES do install, de propósito: se o lock não corresponde aos .in, o
        # que o step seguinte instalaria não é o conjunto que alguém aprovou, e
        # o resultado da suíte não diria respeito a nada revisável.
        #
        # O script recompila requirements.in / requirements-dev.in e compara
        # byte a byte com os arquivos commitados. Pega tanto o arquivo gerado
        # editado à mão quanto o .in mudado sem recompilar. Sem este step o
        # lock seria só documentação — nada obrigaria os dois a concordarem.
        #
        # O uv é pinado: versões diferentes podem formatar a saída de outro
        # jeito e a comparação é exata. Ao subir aqui, suba também o UV_VERSAO
        # de scripts/travar_deps.py e regenere os dois .txt no mesmo commit.
        run: |
          pip install uv==0.12.5
          python scripts/travar_deps.py --check

      - name: Instalar dependências
        # requirements-dev.txt é AUTOCONTIDO: o lock traz as de produção e as de
        # teste, todas em ==, então um comando cobre runtime e teste. (Antes de
        # travar, o mesmo efeito vinha de uma linha "-r requirements.txt" no topo
        # do arquivo; o uv achata essa referência ao compilar, e um lock que
        # lista tudo explicitamente é o que se quer de um lock.)
        run: pip install -r requirements-dev.txt

      - name: Rodar testes
        run: python -m pytest tests/ -q
